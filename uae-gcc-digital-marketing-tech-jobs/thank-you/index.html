  <title>Order Confirmed | GCC Career Access List</title>

  <style>
    :root { --gcc: #1B55DB; }

    body { background: #f8faff; display: flex; flex-direction: column; min-height: 100vh; }

    .ty-header {
      background: #fff; border-bottom: 1px solid var(--border); padding: .9rem 0;
    }
    .ty-header-inner { display: flex; align-items: center; justify-content: space-between; }
    .ty-logo img { height: 32px; width: auto; display: block; }

    .ty-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 4rem 1rem;
    }
    .ty-card {
      background: #fff; border-radius: 20px; padding: 3rem 2.5rem;
      max-width: 520px; width: 100%; text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.08);
      border: 1px solid var(--border);
    }
    .ty-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(27,85,219,.1); border: 2px solid rgba(27,85,219,.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.75rem;
    }
    .ty-icon svg { color: #1B55DB; }
    .ty-card h1 {
      font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 900;
      color: var(--dark); margin-bottom: .75rem; line-height: 1.2;
    }
    .ty-card p { font-size: 1rem; color: var(--mid); line-height: 1.7; margin: 0 0 .5rem; }
    .ty-spam {
      margin-top: 1.75rem; padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      font-size: .85rem; color: var(--mid);
    }
    .ty-spam a { color: #1B55DB; text-decoration: none; }
    .ty-spam a:hover { text-decoration: underline; }
    .ty-back {
      display: inline-block; margin-top: 2rem;
      font-size: .88rem; color: var(--mid); text-decoration: none;
    }
    .ty-back:hover { color: #1B55DB; }

    .ty-footer {
      background: #0D1527; padding: 1.75rem 0; text-align: center;
    }
    .ty-footer p { font-size: .8rem; color: rgba(255,255,255,.35); margin: 0; }
    .ty-footer a { color: rgba(255,255,255,.5); text-decoration: none; }
    .ty-footer a:hover { color: #fff; }

    @media (max-width: 500px) {
      .ty-card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->

  <header class="ty-header">
    <div class="container ty-header-inner">
      <a href="/" class="ty-logo">
        <img src="/xyz-lab-logo.png" alt="XYZ Lab" />
      </a>
    </div>
  </header>

  <main class="ty-main">
    <div class="ty-card">
      <div class="ty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1>Order confirmed —<br/>check your inbox.</h1>
      <p>The GCC Career Access List is on its way to your email address.</p>
      <div class="ty-spam">
        Nothing in 10 minutes? Check your spam folder or email <a href="mailto:hello@xyzlab.com">hello@xyzlab.com</a> and we'll sort it straight away.
      </div>
      <a href="/uae-gcc-digital-marketing-tech-jobs/" class="ty-back">← Back to the list page</a>
    </div>
  </main>

  <footer class="ty-footer">
    <div class="container">
      <p>&copy; <span id="ty-year"></span> XYZ Lab Pte. Ltd. &nbsp;·&nbsp; <a href="/">xyzlab.com</a></p>
    </div>
  </footer>

  <script>document.getElementById('ty-year').textContent = new Date().getFullYear();</script>
</body>
